<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ce qu'ils disent de moi | Camille & Cie</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-stone-50 text-stone-800 pt-24">

    <nav class="fixed top-0 left-0 right-0 z-50 bg-stone-50 bg-opacity-95 backdrop-blur border-b border-stone-200">
        <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
            <a href="index.html" class="font-serif text-2xl font-semibold tracking-tight text-stone-900">Camille & Cie</a>
            <div class="hidden md:flex items-center gap-10 text-sm font-medium text-stone-500">
                <a href="services.html" class="hover:text-stone-900 transition-colors">Services</a>
                <a href="avis.html" class="text-stone-900 font-semibold border-b border-stone-900 pb-1">Avis</a>
                <a href="reservation.html" class="flex items-center gap-1.5 bg-stone-900 hover:bg-stone-700 text-white text-sm font-medium px-5 py-2.5 rounded-full transition-colors">
                    Réserver <i data-lucide="arrow-up-right" class="w-3.5 h-3.5"></i>
                </a>
            </div>
            <button class="md:hidden text-stone-900" onclick="toggleMenu()">
                <i data-lucide="menu" id="menu-icon" class="w-6 h-6"></i>
            </button>
        </div>
        <div id="mobile-menu" class="hidden md:hidden border-t border-stone-100 bg-stone-50 px-6 py-5 flex flex-col gap-5 text-sm text-stone-600">
            <a href="services.html" class="text-left hover:text-stone-900">Services</a>
            <a href="avis.html" class="text-left font-semibold text-stone-900">Avis</a>
            <a href="reservation.html" class="text-left font-medium text-stone-900">Réserver</a>
        </div>
    </nav>

    <section class="py-20 px-6 max-w-6xl mx-auto">
        <div class="border-b border-stone-200 pb-8 mb-16">
            <p class="text-stone-400 text-xs tracking-widest uppercase mb-3">Ils me font confiance</p>
            </div>
        </div>

        <div class="max-w-4xl mx-auto grid md:grid-cols-2 gap-16 items-start bg-stone-900 text-white p-8 md:p-12 rounded-3xl">
            <div>
                <p class="text-stone-400 text-xs tracking-widest uppercase mb-5">Votre expérience</p>
                <h2 class="font-serif text-4xl md:text-5xl font-semibold leading-tight mb-6">
                    Partagez votre<br /><span class="italic font-normal text-stone-300">témoignage.</span>
                </h2>
                <p class="text-stone-400 text-sm leading-relaxed font-light">
                    Votre avis est précieux. Il m'aide à m'améliorer et rassure les futurs propriétaires qui cherchent une personne de confiance pour leurs compagnons.
                </p>
            </div>
            
            <form action="#" method="POST" class="space-y-5 w-full">
                <div>
                    <label class="block text-stone-400 text-xs uppercase tracking-wider mb-2">Votre Nom</label>
                    <input type="text" required placeholder="Ex: Lucas B." class="w-full bg-stone-800 border border-stone-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-stone-500 transition-colors">
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-stone-400 text-xs uppercase tracking-wider mb-2">Votre compagnon</label>
                        <input type="text" required placeholder="Ex: Simba, chat" class="w-full bg-stone-800 border border-stone-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-stone-500 transition-colors">
                    </div>
                    <div>
                        <label class="block text-stone-400 text-xs uppercase tracking-wider mb-2">Note globale</label>
                        <select required class="w-full bg-stone-800 border border-stone-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-stone-500 transition-colors appearance-none">
                            <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
                            <option value="4">⭐⭐⭐⭐ (4/5)</option>
                            <option value="3">⭐⭐⭐ (3/5)</option>
                            <option value="2">⭐⭐ (2/5)</option>
                            <option value="1">⭐ (1/5)</option>
                        </select>
                    </div>
                </div>
                
                <div>
                    <label class="block text-stone-400 text-xs uppercase tracking-wider mb-2">Votre Message</label>
                    <textarea rows="4" required placeholder="Racontez comment s'est passée la garde..." class="w-full bg-stone-800 border border-stone-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-stone-500 transition-colors resize-none"></textarea>
                </div>
                
                <button type="submit" class="w-full flex items-center justify-center gap-2 bg-white text-stone-900 font-medium py-3.5 rounded-xl hover:bg-stone-100 transition-colors">
                    Publier mon avis <i data-lucide="send" class="w-4 h-4"></i>
                </button>
            </form>
        </div>
    </section>

    <footer class="bg-stone-950 text-stone-700 text-center py-7 text-xs tracking-wide">
        <span class="font-serif text-stone-400 text-base">Camille & Cie</span>
    </footer>

    <script>
        lucide.createIcons();
        
        function toggleMenu() {
            const menu = document.getElementById('mobile-menu');
            const icon = document.getElementById('menu-icon');
            menu.classList.toggle('hidden');
            icon.setAttribute('data-lucide', menu.classList.contains('hidden') ? 'menu' : 'x');
            lucide.createIcons();
        }
    </script>
</body>
</html>
